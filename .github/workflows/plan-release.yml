name: Plan agent release

on:
  push:
    branches:
      - main
    tags:
      - "plan-v*"
    paths:
      - "launcher/**"
      - "launcher.Tests/**"
      - "plan-agent/**"
      - "installer/**"
      - ".github/workflows/plan-release.yml"
  pull_request:
    paths:
      - "launcher/**"
      - "launcher.Tests/**"
      - "plan-agent/**"
      - "installer/**"
      - ".github/workflows/plan-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag (defaults to plan-v1.0.<run number>)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve version from plan-v* tag
        id: ver
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          . .\launcher\Get-LauncherReleaseVersion.ps1
          $tag = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:INPUT_TAG) { $tag = $env:INPUT_TAG }
          $v = Get-LauncherReleaseVersion -Tag $tag -Fallback '1.0.0'
          $file = Get-LauncherFileVersion -Version $v
          $info = Get-LauncherInformationalVersion -Version $v -Sha $env:GITHUB_SHA
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file_version=$file" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "informational=$info" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish PlanAgent.exe
        run: >
          dotnet publish launcher/PlanAgent.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.file_version }}
          -p:InformationalVersion=${{ steps.ver.outputs.informational }}
          -o dist
      - name: Test launcher
        run: dotnet test launcher.Tests/PlanAgent.Tests.csproj -c Release
      - name: Install WiX and build PlanAgent.msi
        shell: pwsh
        run: |
          dotnet tool install --global wix
          $env:Path = "$env:USERPROFILE\.dotnet\tools;" + $env:Path
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wix build installer/PlanAgent.wxs `
            -d "ProductVersion=${{ steps.ver.outputs.version }}" `
            -d "PlanExe=$PWD\dist\PlanAgent.exe" `
            -d "PlanRoot=$PWD\plan-agent" `
            -o dist/PlanAgent.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
      - name: Install and uninstall the MSI
        shell: pwsh
        run: |
          $msi = Join-Path $PWD 'dist\PlanAgent.msi'
          $log = Join-Path $PWD 'dist\install.log'
          $p = Start-Process msiexec -ArgumentList @('/i', $msi, '/qn', '/l*v', $log) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec install exit $($p.ExitCode)" }
          $exe = Join-Path ${env:ProgramFiles} 'Plan Agent\PlanAgent.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "PlanAgent.exe missing after install" }
          $u = Start-Process msiexec -ArgumentList @('/x', $msi, '/qn') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec uninstall exit $($u.ExitCode)" }
          if (Test-Path -LiteralPath $exe) { throw "PlanAgent.exe still present after uninstall" }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plan-agent-release
          path: |
            dist/PlanAgent.exe
            dist/PlanAgent.msi
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/plan-v'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plan-agent-release
          path: dist
      - name: Checksums and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          foreach ($name in @('PlanAgent.exe', 'PlanAgent.msi')) {
            $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "dist\$name.sha256" -Value "$hash  $name" -NoNewline
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:INPUT_TAG) { $tag = $env:INPUT_TAG }
          else { $tag = "plan-v1.0.$env:GITHUB_RUN_NUMBER" }
          if ($tag -notmatch '^plan-v') { throw "Release tag must begin with plan-v" }
          $assets = @(
            'dist\PlanAgent.exe',
            'dist\PlanAgent.exe.sha256',
            'dist\PlanAgent.msi',
            'dist\PlanAgent.msi.sha256'
          )
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --notes "Plan Agent release. Assets keep stable names PlanAgent.exe and PlanAgent.msi." --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release failed" }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object name)
          foreach ($asset in @('PlanAgent.exe', 'PlanAgent.exe.sha256', 'PlanAgent.msi', 'PlanAgent.msi.sha256')) {
            if ($asset -notin $names) { throw "Release asset is missing: $asset" }
          }
