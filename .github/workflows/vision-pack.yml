name: vision-pack

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate product vision pack
        run: python tools/validate-vision-pack.py docs/vision.md --mocks-dir docs/mocks
      - name: pytest
        run: pip install pytest && pytest tests/ -q
